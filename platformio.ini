; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32F103C8]
platform = ststm32
board = genericSTM32F103C8
framework = stm32cube
board_build.ldscript = project/STM32F103C8TX_FLASH.ld
build_flags =
	-I include
	-I project/Drivers/CMSIS/Include
	-I project/Drivers/CMSIS/Device/ST/STM32F1xx/Include
upload_protocol = stlink
; OpenOCD 0.12+ dropped the hla_swd transport; drive the ST-Link through stlink-dap.
upload_command = $PROJECT_PACKAGES_DIR/tool-openocd/bin/openocd -s $PROJECT_PACKAGES_DIR/tool-openocd/openocd/scripts -f interface/stlink-dap.cfg -c "transport select dapdirect_swd" -f target/stm32f1x.cfg -c "program {$SOURCE} verify reset exit"
debug_tool = stlink
monitor_speed = 128000
monitor_port = /dev/ttyACM1
